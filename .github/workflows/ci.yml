name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - services/auth-service
          - services/product-service
          - services/cart-service
          - services/order-service
          - services/payment-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Unit, API and contract tests with coverage
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.project }}/coverage
          if-no-files-found: ignore

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: ignore

  ui-smoke-tests:
    name: UI smoke tests (Selenium + Playwright)
    runs-on: ubuntu-latest
    needs: backend-tests
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-jwt-secret
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the frontend and gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null && curl -s -o /dev/null http://localhost:4000; then
              echo "Stack is up"; exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready"; docker compose ps; docker compose logs --tail=100; exit 1

      - name: Seed product catalog
        run: docker compose exec -T product-service npm run seed

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cross-service integration tests (real RabbitMQ events)
        working-directory: integration-tests
        run: |
          npm install
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run Selenium smoke tests
        working-directory: selenium-tests
        run: mvn -B test -Dgroups=smoke -Dheadless=true

      - name: Generate Allure report
        if: always()
        working-directory: selenium-tests
        run: mvn -B allure:report

      - name: Upload Selenium reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            selenium-tests/target/surefire-reports
            selenium-tests/target/screenshots
            selenium-tests/target/allure-results
            selenium-tests/target/site/allure-maven-plugin
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: playwright-tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: playwright-tests
        run: npx playwright test --grep @smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-tests/playwright-report
            playwright-tests/test-results
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
